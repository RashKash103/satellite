name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write       # create the release
  id-token: write       # sign the build attestation
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test
        run: go vet ./... && go test -count=1 ./... && test/run
      - name: build
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" -o dist/sat_linux_$arch ./cmd/sat
          done
          (cd dist && sha256sum sat_linux_* > checksums.txt)
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/sat_linux_*
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
